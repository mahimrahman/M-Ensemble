# Release: build both images and push them to GHCR, tagged with the git tag.
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# Produces
#   ghcr.io/<owner>/m-ensemble-api:v1.2.0    (+ :1.2, :latest)
#   ghcr.io/<owner>/m-ensemble-admin:v1.2.0  (+ :1.2, :latest)
#
# Pushing is all this does. The deploy itself is a separate, deliberate step —
# see the commented block at the end and infra/README.md — so that a tag can be
# built, pulled onto staging and looked at before production moves to it.

name: Release images

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/server/Dockerfile
          - name: admin
            dockerfile: apps/admin/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/m-ensemble-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ─── Deploy hook (opt in) ────────────────────────────────────────────────
