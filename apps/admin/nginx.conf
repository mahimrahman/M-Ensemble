# The console's nginx. Rendered through envsubst at container start — the one
# variable is ${API_UPSTREAM} (see the Dockerfile). Everything else that looks
# like a variable is nginx's own.
#
# TLS is not terminated here. In docker-compose.prod.yml Caddy sits in front
# and speaks HTTPS; on Render/Fly the platform does. This server only ever sees
# plain HTTP from a trusted proxy, which is why it trusts X-Forwarded-Proto.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Posters are 8MB on the wire plus multipart framing; the API enforces the
    # real cap and reports it as a 400 the console can show.
    client_max_body_size 10m;

    # ─── Security headers ───────────────────────────────────────────────────
    # `always` so they go out on error responses too. Kept at server level and
    # never re-declared in a location: an `add_header` inside a location block
    # replaces this whole set, so the locations below use `expires` instead.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # self for the bundle; Google Fonts for the three families index.html loads;
    # Sentry's ingest hosts for error reports; any https host for <img> because
    # posters and logos come from the S3/R2 public URL, which differs per
    # environment. No inline scripts anywhere — Vite emits none.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ─── The API, same origin ───────────────────────────────────────────────
    # `proxy_pass` without a URI part forwards the path unchanged, so
    # /api/health upstream is /api/health, which is how the API mounts it.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Stripe posts here with a signature over the raw body — proxied byte for
    # byte, no buffering changes, no body rewriting.
    location /webhooks/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Local-disk posters, for a deployment without S3 (a laptop running compose).
    # With S3 configured the API hands out absolute CDN URLs and this is unused.
    location /uploads/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # ─── The SPA ────────────────────────────────────────────────────────────
    # Vite names every asset by content hash, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html must never be cached: it is the only file whose name does not
    # change, and a stale copy points at asset hashes that no longer exist.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
